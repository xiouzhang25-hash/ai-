<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>AI角色聊天</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0b0d10;
    color: #f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                 "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
}

.app {
    width: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
}

/* 顶部 */
.header {
    height: 72px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    border-bottom: 1px solid #24272c;
    background: #0f1115;
}

.character {
    display: flex;
    align-items: center;
    gap: 12px;
}

.avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #30343b;
    font-size: 22px;
}

.character-info {
    display: flex;
    flex-direction: column;
}

.character-name {
    font-size: 17px;
    font-weight: 600;
}

.status {
    margin-top: 3px;
    font-size: 12px;
    color: #8f969f;
}

.menu {
    font-size: 25px;
    color: #aeb4bd;
}

/* 聊天区域 */
.chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 110px;
    scroll-behavior: smooth;
}

.message {
    display: flex;
    margin-bottom: 18px;
}

.message.ai {
    justify-content: flex-start;
}

.message.user {
    justify-content: flex-end;
}

.bubble {
    max-width: 78%;
    padding: 12px 15px;
    border-radius: 18px;
    font-size: 16px;
    line-height: 1.55;
    word-wrap: break-word;
}

.ai .bubble {
    background: #20242a;
    border-bottom-left-radius: 5px;
}

.user .bubble {
    background: #3a7afe;
    border-bottom-right-radius: 5px;
}

/* 输入区 */
.input-area {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: rgba(11, 13, 16, 0.94);
    backdrop-filter: blur(20px);
    border-top: 1px solid #24272c;
}

.input-box {
    display: flex;
    align-items: flex-end;
    gap: 8px;
}

textarea {
    flex: 1;
    min-height: 44px;
    max-height: 120px;
    resize: none;
    border: none;
    outline: none;
    border-radius: 22px;
    padding: 12px 16px;
    background: #20242a;
    color: white;
    font-size: 16px;
    font-family: inherit;
}

textarea::placeholder {
    color: #777d86;
}

.send {
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    background: #3a7afe;
    color: white;
    font-size: 20px;
    flex-shrink: 0;
}

.send:active {
    transform: scale(0.94);
}

/* 底部功能 */
.tools {
    display: flex;
    justify-content: space-around;
    margin-top: 8px;
    padding-top: 4px;
}

.tool {
    color: #858b94;
    font-size: 12px;
    text-align: center;
}

/* 打字状态 */
.typing {
    color: #858b94;
    font-size: 13px;
    padding: 0 8px 10px;
    display: none;
}
</style>
</head>

<body>

<div class="app">

    <header class="header">

        <div class="character">

            <div class="avatar">🤍</div>

            <div class="character-info">
                <div class="character-name">小雨</div>
                <div class="status">在线</div>
            </div>

        </div>

        <div class="menu">•••</div>

    </header>


    <main class="chat" id="chat">

        <div class="message ai">
            <div class="bubble">
                嗨，我是小雨。<br>
                今天想和我聊点什么？
            </div>
        </div>

    </main>


    <div class="typing" id="typing">
        小雨正在输入……
    </div>


    <div class="input-area">

        <div class="input-box">

            <textarea
                id="input"
                rows="1"
                placeholder="输入消息……"
            ></textarea>

            <button class="send" onclick="sendMessage()">↑</button>

        </div>

        <div class="tools">
            <div class="tool">＋ 功能</div>
            <div class="tool">🧠 记忆</div>
            <div class="tool">🎭 人格</div>
            <div class="tool">⚙️ 设置</div>
        </div>

    </div>

</div>


<script>

const input = document.getElementById("input");
const chat = document.getElementById("chat");
const typing = document.getElementById("typing");

input.addEventListener("input", function () {
    this.style.height = "auto";
    this.style.height = Math.min(this.scrollHeight, 120) + "px";
});

input.addEventListener("keydown", function (event) {

    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }

});


function addMessage(text, type) {

    const message = document.createElement("div");
    message.className = "message " + type;

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    bubble.textContent = text;

    message.appendChild(bubble);
    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;
}


function sendMessage() {

    const text = input.value.trim();

    if (!text) return;

    addMessage(text, "user");

    input.value = "";
    input.style.height = "44px";

    typing.style.display = "block";

    setTimeout(() => {

        typing.style.display = "none";

        addMessage(
            "我看到你的消息了。等我们接入真正的 AI 模型后，我就可以根据自己的性格和记忆认真和你聊天了。",
            "ai"
        );

    }, 900);

}

</script>

</body>
</html>
